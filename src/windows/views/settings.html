<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no"/>
    <meta name="renderer" content="webkit"/>
    <meta name="force-rendering" content="webkit"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>

    <!-- MDUI CSS -->
    <link rel="stylesheet" href="mdui.min.css"/>

    <title>系统设置</title>
    <style>
        body{
            padding-top: 20px;
        }

        [v-cloak]{
            display: none;
        }

        /*.doc-title {*/
        /*    font-size: 34px;*/
        /*    line-height: 40px;*/
        /*    margin: 0 400px 30px 0;*/
        /*}*/

        .container{
            padding-right: 60px;
        }
        .set-title-panel{
            margin-top: -10px;
            font-size: 28px;
            line-height: 34px;
        }

        .set-content-panel{
            margin-top: 40px;
        }

        .set-save-panel{
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .loadPage{
            position: fixed;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
        }

        .drawer-item {
            font-size: 16px;
        }

    </style>
</head>

<body class="mdui-theme-primary-blue" >

<div class="mdui-container-fluid" id="page" v-cloak>
    <div class="close-panel" >
        <button class="mdui-btn mdui-color-white mdui-text-color-gray"
            style="position: fixed;top: 30px;right:0px;"
            onclick="exitSetting()"
            >返回</button>
    </div>
    <div class="loadPage"  v-if="!handLoadStorage">
        <div class="mdui-spinner mdui-center" style="margin-top: calc(45vh)">
            <div class="mdui-spinner-layer ">
                <div class="mdui-spinner-circle-clipper mdui-spinner-left">
                    <div class="mdui-spinner-circle"></div>
                </div>
                <div class="mdui-spinner-gap-patch">
                    <div class="mdui-spinner-circle"></div>
                </div>
                <div class="mdui-spinner-circle-clipper mdui-spinner-right">
                    <div class="mdui-spinner-circle"></div>
                </div>
            </div>
        </div>
        <div style="text-align: center">
            <p>正在载入设置选项...</p>
        </div>
    </div>
    <div v-else class="">
        <div class="" style="height: calc(100vh);position: fixed;width: 150px;top:20px">
            <div class="drawer">
                <ul class="mdui-list">
                    <li class="mdui-list-item mdui-ripple" onclick="showPage('link-set')">
                        <div class="mdui-list-item-content drawer-item">外链设置</div>
                    </li>
                    <li class="mdui-list-item mdui-ripple" onclick="showPage('wartermark-set')">
                        <div class="mdui-list-item-content drawer-item">水印设置</div>
                    </li>
                    <li class="mdui-list-item mdui-ripple" onclick="showPage('host-set')">
                        <div class="mdui-list-item-content drawer-item">服务器设置</div>
                    </li>
                    <li class="mdui-list-item mdui-ripple" onclick="showPage('proxy-set')">
                        <div class="mdui-list-item-content drawer-item">网络代理</div>
                    </li>
                    <li class="mdui-list-item mdui-ripple" onclick="showPage('about-info')">
                        <div class="mdui-list-item-content drawer-item">关于</div>
                    </li>
                </ul>
            </div>
        </div>
        <div class="container" style="padding-left: 180px">
            <div v-if="pageShow==='host-set'">
                <div class="set-title-panel">
                    <p class="doc-title">服务器设置</p>
                </div>
                <div class="set-content-panel">
                    <p>默认网页版飞书登录页，你可在下方设置自定义地址，保存后重启后生效。</p>
                    <p></p>
                    <div class="mdui-textfield">
                        <textarea class="mdui-textfield-input"
                                  placeholder="https://feishu.cn/messenger/"
                                  v-model="startPageLink"></textarea>
                    </div>

                </div>
            </div>


            <div v-if="pageShow==='wartermark-set'">
                <div class="set-title-panel">
                    <p class="doc-title">水印设置</p>
                </div>
                <div class="set-content-panel">
                    <label class="mdui-switch">
                        <span style="margin-right:20px">显示页面水印</span>
                        <label class="mdui-switch">
                            <input type="checkbox" v-model="showWarterMark">
                            <i class="mdui-switch-icon"></i>
                          </label>
                    </label>
                    <br><br>
                    <p>打开后将会显示飞书水印，保存后重启后生效。</p>
                </div>
            </div>

            <div v-if="pageShow==='link-set'">
                <div class="set-title-panel">
                    <p class="doc-title">外链设置</p>
                </div>
                <div class="set-content-panel">
                    <p>应用内打开的链接（每行一个），其他链接默认使用系统浏览器打开，保存后重启后生效。</p>
                    <p></p>

                    <div class="mdui-textfield" style="margin-top: 20px;">
                    <textarea class="mdui-textfield-input"
                              v-model="larkOpenLink"
                              style="background: #f1f1f1; padding: 10px" rows="10"
                              placeholder="请在此处设置需在应用内打开的链接，如&#13;&#10;https://github.com&#13;&#10;https://google.com"></textarea>
                    </div>
                </div>
            </div>

            <div v-if="pageShow==='proxy-set'">
                <div class="set-title-panel">
                    <p class="doc-title">网络代理</p>
                </div>
                <div class="set-content-panel">
                    <p>设置应用程序的网络代理，，保存后重启后生效。</p>
                    <p></p>

                    <label class="mdui-radio" style="display: block; margin: 14px 0;">
                        <input type="radio" name="proxy-mode" value="direct" v-model="proxyMode">
                        <i class="mdui-radio-icon"></i>
                        <span style="margin-left: 6px">网络直连</span>
                    </label>
                    <label class="mdui-radio" style="display: block; margin: 14px 0;">
                        <input type="radio" name="proxy-mode" value="system" v-model="proxyMode">
                        <i class="mdui-radio-icon"></i>
                        <span style="margin-left: 6px">系统代理</span>
                    </label>
                    <label class="mdui-radio" style="display: block; margin: 14px 0;">
                        <input type="radio" name="proxy-mode" value="pac" v-model="proxyMode">
                        <i class="mdui-radio-icon"></i>
                        <span style="margin-left: 6px">自动配置（PAC 脚本）</span>
                    </label>
                    <label class="mdui-radio" style="display: block; margin: 14px 0;">
                        <input type="radio" name="proxy-mode" value="fixed" v-model="proxyMode">
                        <i class="mdui-radio-icon"></i>
                        <span style="margin-left: 6px">手动配置（代理服务器）</span>
                    </label>

                    <div v-if="pageShow==='proxy-set' && proxyMode==='direct'" style="margin-top: 25px;">
                        <p>所有连接直连，不使用任何代理</p>
                    </div>
                    <div v-if="pageShow==='proxy-set' && proxyMode==='pac'" style="margin-top: 25px;">
                        <div class="mdui-textfield">
                            <label class="mdui-textfield-label">PAC 脚本网址或本地文件路径</label>
                            <input class="mdui-textfield-input" type="text" v-model="proxyPacUrl"
                                   placeholder="https://example.com/proxy.pac 或 file:///C:/proxy/auto-proxy.pac">
                        </div>
                    </div>
                    <div v-if="pageShow==='proxy-set' && proxyMode==='fixed'" style="margin-top: 25px;">
                        <div class="mdui-textfield">
                            <label class="mdui-textfield-label">代理服务器地址（支持 http/https/socks4/socks5）</label>
                            <input class="mdui-textfield-input" type="text" v-model="proxyServer"
                                   placeholder="http://192.168.2.1:1081 或 socks5://192.168.2.1:1080">
                        </div>
                    </div>
                </div>
            </div>

            <div v-if="pageShow==='about-info'">
                <div class="set-title-panel">
                    <p class="doc-title">关于</p>
                </div>
                <div class="set-content-panel" style="text-align: center;">
                    <img src="../../../icon/128.png" style="width: 72px; height: 72px;"/>
                    <p style="font-size: 22px; margin-top: 10px;">ElectronLark</p>
                    <p style="color: #9e9e9e; font-size: 14px;">当前版本 {{packageVersion}}</p>
                    <p style="color: #616161; font-size: 13px; margin-top: 16px;">基于网页版飞书开发，能满足基础功能使用。</p>
                    <br>
                    <button class="mdui-btn mdui-color-blue mdui-text-color-white mdui-ripple"
                        onclick="btnCheckUpdateClick()">检查更新</button>
                    <br><br>
                    <div>
                        <button class="mdui-btn mdui-color-blue mdui-text-color-white mdui-ripple"
                            onclick="gotoProjectHome()">前往项目主页</button>
                    </div>
                </div>
            </div>

            <div v-if="pageShow !='about-info'" class="set-save-panel">
                <button class="mdui-btn mdui-color-blue mdui-text-color-white mdui-ripple"
                        onclick="btnSaveClick()">保存设置</button>
            </div>

        </div>

    </div>

</div>


</body>
<script src="vue.min.js" type="text/javascript"></script>
<script src="mdui.min.js" type="text/javascript"></script>
<script>

    let appStoreFs = require("fs");

    console.log("载入 electron-store 成功")
    console.log(appStoreFs)

    const KEY_START_PAGE = "startPageLink"
    const KEY_LARK_OPEN_LINK = "larkOpenLink"

    let pageData = {
        pageShow: 'link-set',
        handLoadStorage: true,
        startPageLink: null, // 启动页设置
        larkOpenLink: null, // 需要在 electron 内打开的链接
        showWarterMark: false,
        proxyMode: 'system', // 代理模式: system/pac/fixed/direct
        proxyPacUrl: null, // PAC 脚本地址
        proxyServer: null, // 固定代理服务器地址
        packageVersion: "未知版本",
        checkingUpdate: false, // 是否正在检查更新
    };

    getConfigJson();

    let vuePage = new Vue({
        el: "#page",
        data: pageData,
        methods: {

        }
    });

    // 读取版本信息
    try{
        const path = require('path')
        let packageVersion = require(path.join(__dirname, './../../../package.json')).version
        pageData.packageVersion = packageVersion;
    }catch(e) {}

    function showPage(page){
        pageData.pageShow = page
    }

    // 支持通过 URL hash 直接定位页签（托盘"关于"入口用）
    try{
        let hashPage = decodeURIComponent(window.location.hash.replace('#', ''))
        if(hashPage !== ''){
            pageData.pageShow = hashPage
        }
    }catch(e){}

    function btnSaveClick(){
       saveConfig()
    }

    // 检查更新走主进程 IPC（主进程负责调 updateChecker 并弹通知）
    function btnCheckUpdateClick(){
        if(pageData.checkingUpdate) return
        pageData.checkingUpdate = true
        mdui.snackbar({ message: '正在检查更新...' })
        try{
            require('electron').ipcRenderer.send("check-update")
        }catch(e){
            console.log(e)
            pageData.checkingUpdate = false
        }
        // 防止主进程无响应导致按钮永久锁定
        setTimeout(function(){
            pageData.checkingUpdate = false
        }, 20000)
    }

    function getConfigJson(){
        if(appStoreFs == null) return
        appStoreFs.readFile('config.json','utf-8',function(err,data){
            if(err){
                console.log(err)
                console.log("读取json配置文件失败")
            }
            else{
                console.log("read config json:" + data);
                let configJson = JSON.parse(data);
                pageData.startPageLink = configJson.startPageLink;
                pageData.larkOpenLink = configJson.larkOpenLink;
                pageData.showWarterMark = configJson.showWarterMark;
                pageData.proxyMode = configJson.proxyMode || 'system';
                pageData.proxyPacUrl = configJson.proxyPacUrl;
                pageData.proxyServer = configJson.proxyServer;
            }
        });
    }

    function saveConfig(){
        if (appStoreFs == null) {
            console.log("fs 载入失败")
            return;
        }
        let configJson = {
            startPageLink: pageData.startPageLink,
            larkOpenLink: pageData.larkOpenLink,
            showWarterMark: pageData.showWarterMark,
            proxyMode: pageData.proxyMode,
            proxyPacUrl: pageData.proxyPacUrl,
            proxyServer: pageData.proxyServer,
        }
        appStoreFs.writeFile("config.json",JSON.stringify(configJson, null, "  "),function (err) {
            if(err){
                console.log(err);
            }else{
                console.log("配置保存成功")
                mdui.snackbar({
                    message: '配置保存成功'
                });

            }
        })
    }

    function exitSetting(){
        window.close();
    }

    function gotoProjectHome(){
        require('electron').shell.openExternal('https://github.com/RichieMay/electron-lark')
    }

</script>
</html>
