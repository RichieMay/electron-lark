name: Build Electron-Lark for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Electron-Lark uses Electron 15 / electron-builder 22, so use Node 16
      # for the closest match to its original dependency generation.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows x64 installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-lark-windows-x64
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
